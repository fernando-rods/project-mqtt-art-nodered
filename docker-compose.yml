################################################################################
# JaCaMo-REST: Integration (JaCaMo + Node-RED + Broker MQTT)
################################################################################
# docker-compose up
################################################################################

services:
  nodered:
    image: nodered/node-red:1.0.4
    hostname: nodered
    environment:
      - TZ=America/Sao_Paulo
      - FLOWS=flows/flows.json
    ports:
      - "1880:1880"
    networks:
      - jacamo-nodered-net
    volumes:
      - "./node-red:/data"
    depends_on:
      - mas
      - mosquitto

  mas:
    image: jomifred/jacamo:1.1
    hostname: mas
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
      - "3272:3272"
    networks:
      - jacamo-nodered-net
    volumes:
      - "./app_jacamo:/app"
    working_dir: /app
    command: /jacamo/build/scripts/jacamo main.jcm

  mosquitto:
    image: eclipse-mosquitto:2
    hostname: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - "./mosquitto/config:/mosquitto/config"
      - "./mosquitto/data:/mosquitto/data"
      - "./mosquitto/log:/mosquitto/log"
    networks:
      - jacamo-nodered-net

networks:
  jacamo-nodered-net:
